<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FollowUp - Activity Log</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           Design Tokens
           ========================================= */
        :root {
            --ink: #111b21;
            --ink-light: #667781;
            --primary: #3f8cff;
            --primary-light: rgba(63, 140, 255, 0.1);
            --accent: #17b3a3;
            --bg-color: #f7f9fa;
            --surface: #ffffff;
            --whatsapp: #25D366;
            --radius-main: 24px;
            --shadow-card: 0 4px 15px rgba(0,0,0,0.03);
            --transition: 0.3s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Heebo', sans-serif; background-color: #d1d7db;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; color: var(--ink); padding: 20px;
        }

        /* Device Mockup */
        .app-device {
            width: 100%; max-width: 414px; height: 896px; max-height: 90vh;
            background-color: var(--bg-color);
            border-radius: 44px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.15), inset 0 0 0 12px #000;
            overflow: hidden; display: flex; flex-direction: column; position: relative;
        }
        
        /* Dynamic Island */
        .app-device::before {
            content: ''; position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
            width: 120px; height: 28px; background: #000; border-radius: 20px; z-index: 100;
        }

        /* =========================================
           Top Navigation
           ========================================= */
        .nav-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 50px 20px 15px; background: var(--surface); z-index: 10;
        }
        .nav-btn {
            background: none; border: none; font-size: 1.2rem; cursor: pointer;
            color: var(--primary); display: flex; align-items: center; justify-content: center;
            width: 40px; height: 40px; border-radius: 50%; background: rgba(63,140,255,0.1);
        }
        .nav-title { font-weight: 800; font-size: 1.15rem; color: var(--ink); }

        /* =========================================
           Segmented Control (Tabs)
           ========================================= */
        .tabs-container {
            background: var(--surface); padding: 0 20px 16px; border-bottom: 1px solid #eaeaea;
        }
        .tabs {
            display: flex; background: #f0f2f5; border-radius: 14px; position: relative; padding: 4px;
        }
        .tab {
            flex: 1; text-align: center; padding: 10px 0; font-size: 0.95rem; font-weight: 700;
            color: var(--ink-light); cursor: pointer; position: relative; z-index: 2; transition: 0.3s;
        }
        .tab.active { color: var(--ink); }
        .tab-indicator {
            position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px);
            background: var(--surface); border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1;
        }
        /* RTL trick for indicator */
        .tabs[data-active="1"] .tab-indicator { transform: translateX(0); }
        .tabs[data-active="2"] .tab-indicator { transform: translateX(-100%); }

        /* =========================================
           Scroll & List Area
           ========================================= */
        .scroll-area { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 20px; }
        .scroll-area::-webkit-scrollbar { display: none; }

        .date-header {
            font-size: 0.85rem; font-weight: 800; color: var(--ink-light);
            margin: 10px 0 16px; position: relative; text-align: center;
        }
        .date-header::before {
            content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 1px;
            background: #e1e5e8; z-index: -1;
        }
        .date-header span {
            background: var(--bg-color); padding: 0 12px;
        }

        /* =========================================
           Activity Cards
           ========================================= */
        .activity-card {
            background: var(--surface); border-radius: 20px; padding: 16px; margin-bottom: 16px;
            box-shadow: var(--shadow-card); border: 1px solid rgba(0,0,0,0.02);
            position: relative; overflow: hidden;
        }
        /* Side color tag for event type */
        .activity-card::before {
            content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 4px;
        }
        .card-missed::before { background-color: var(--primary); }
        .card-after::before { background-color: var(--accent); }

        .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;}
        
        .contact-info { display: flex; align-items: center; gap: 12px; }
        .contact-avatar {
            width: 44px; height: 44px; border-radius: 50%;
            background: #f0f2f5; color: var(--ink-light);
            display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: 700;
        }
        .avatar-blue { background: #e8f1ff; color: var(--primary); }
        
        .contact-details h3 { font-size: 1.05rem; font-weight: 800; margin-bottom: 2px; line-height: 1.2;}
        .contact-details p { font-size: 0.85rem; color: var(--ink-light); display: flex; align-items: center; gap: 6px;}
        
        .time-badge { font-size: 0.75rem; color: var(--ink-light); font-weight: 500; }

        .action-summary {
            background: #f8fafb; padding: 10px 12px; border-radius: 12px;
            font-size: 0.85rem; color: var(--ink); margin-bottom: 16px;
            display: flex; align-items: center; gap: 8px; border: 1px solid #f0f2f5;
        }
        .blue-ticks { color: #53bdeb; font-size: 0.85rem; letter-spacing: -2px;}

        /* Quick Action Buttons */
        .card-actions { display: flex; gap: 10px; }
        .action-btn {
            flex: 1; padding: 10px; border-radius: 12px; font-size: 0.9rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            cursor: pointer; border: none; transition: 0.2s;
        }
        .btn-whatsapp { background: rgba(37, 211, 102, 0.1); color: #1da851; }
        .btn-whatsapp:active { background: rgba(37, 211, 102, 0.2); }
        .btn-call { background: var(--bg-color); color: var(--ink); }
        .btn-call:active { background: #e1e5e8; }

    </style>
</head>
<body>

    <div class="app-device">
        <!-- Top Nav -->
        <div class="nav-bar">
            <button class="nav-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
            </button>
            <div class="nav-title">יומן פעילות</div>
            <button class="nav-btn" style="background: none;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </button>
        </div>

        <!-- Segmented Control (Tabs) -->
        <div class="tabs-container">
            <div class="tabs" data-active="1" id="history-tabs">
                <div class="tab-indicator"></div>
                <div class="tab active" onclick="switchTab(1)">הכל (12)</div>
                <div class="tab" onclick="switchTab(2)">לא עניתי (8)</div>
            </div>
        </div>

        <div class="scroll-area">
            
            <div class="date-header"><span>היום</span></div>

            <!-- Card 1: Missed Call (Unknown Number) -->
            <div class="activity-card card-missed">
                <div class="card-top">
                    <div class="contact-info">
                        <div class="contact-avatar">👤</div>
                        <div class="contact-details">
                            <h3>054-9876543</h3>
                            <p>📞 שיחה שלא נענתה</p>
                        </div>
                    </div>
                    <div class="time-badge">14:30</div>
                </div>
                
                <div class="action-summary">
                    <span>נשלחה הודעת "לא עניתי"</span>
                    <span style="margin-right: auto;" class="blue-ticks">✓✓</span>
                </div>

                <div class="card-actions">
                    <button class="action-btn btn-whatsapp">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                        וואטסאפ
                    </button>
                    <button class="action-btn btn-call">חזור אליו</button>
                </div>
            </div>

            <!-- Card 2: After Call (Saved Contact) -->
            <div class="activity-card card-after">
                <div class="card-top">
                    <div class="contact-info">
                        <div class="contact-avatar avatar-blue">רי</div>
                        <div class="contact-details">
                            <h3>רוני יצחקי - קבלן</h3>
                            <p>🤝 סיום שיחה (4 דק')</p>
                        </div>
                    </div>
                    <div class="time-badge">11:15</div>
                </div>
                
                <div class="action-summary">
                    <span>נשלחו פרטי קשר (vCard)</span>
                    <span style="margin-right: auto;" class="blue-ticks">✓✓</span>
                </div>

                <div class="card-actions">
                    <button class="action-btn btn-whatsapp">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                        וואטסאפ
                    </button>
                    <button class="action-btn btn-call">חייג</button>
                </div>
            </div>

            <div class="date-header"><span>אתמול</span></div>

            <!-- Card 3: Missed Call (Unknown Number) -->
            <div class="activity-card card-missed">
                <div class="card-top">
                    <div class="contact-info">
                        <div class="contact-avatar">👤</div>
                        <div class="contact-details">
                            <h3>052-1112223</h3>
                            <p>📞 שיחה שלא נענתה</p>
                        </div>
                    </div>
                    <div class="time-badge">16:40</div>
                </div>
                
                <div class="action-summary">
                    <span>נשלחה הודעת "לא עניתי"</span>
                    <span style="margin-right: auto;" class="blue-ticks">✓✓</span>
                </div>
                
                <div class="card-actions">
                    <button class="action-btn btn-whatsapp">וואטסאפ</button>
                    <button class="action-btn btn-call">חזור אליו</button>
                </div>
            </div>

            <p style="text-align: center; color: #a0aab2; font-size: 0.85rem; margin-top: 20px;">
                אין עוד פעילויות להציג
            </p>

        </div>
    </div>

    <!-- Script for Tabs Animation -->
    <script>
        function switchTab(tabIndex) {
            const tabsContainer = document.getElementById('history-tabs');
            const tabs = tabsContainer.querySelectorAll('.tab');
            
            // Remove active class from all
            tabs.forEach(tab => tab.classList.remove('active'));
            
            // Add active class to clicked tab
            tabs[tabIndex - 1].classList.add('active');
            
            // Move indicator
            tabsContainer.setAttribute('data-active', tabIndex);
        }
    </script>
</body>
</html>
